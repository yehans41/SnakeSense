# Default configuration for Snake environment

environment:
  board_size: 10
  state_type: 'feature'  # 'feature' or 'grid'
  deterministic: false
  seed: null

rewards:
  food: 1.0
  death: -1.0
  step: -0.01

training:
  episodes: 1000
  max_steps: 1000
  eval_frequency: 100
  save_frequency: 500
  checkpoint_dir: 'checkpoints'
  log_dir: 'reports'

evaluation:
  episodes: 100
  render: false
  save_video: false
