# Configuration for DQN agent

agent:
  type: 'dqn'
  learning_rate: 0.0005
  discount_factor: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  batch_size: 64
  memory_size: 10000
  target_update_frequency: 100
  hidden_dims: [128, 128]
  seed: 42

environment:
  board_size: 10
  state_type: 'feature'  # Can also use 'grid' for CNN
  deterministic: false
  seed: 42

rewards:
  food: 1.0
  death: -1.0
  step: -0.01

training:
  episodes: 10000
  max_steps: 1000
  eval_frequency: 100
  save_frequency: 1000
  checkpoint_dir: 'checkpoints'
  log_dir: 'reports'
  warmup_episodes: 100  # Random episodes before training

evaluation:
  episodes: 100
  render: false
