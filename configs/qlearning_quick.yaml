# Quick Q-Learning training for demo

agent:
  type: 'qlearning'
  learning_rate: 0.1
  discount_factor: 0.95
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  seed: 42

environment:
  board_size: 8  # Smaller board for faster training
  state_type: 'feature'
  deterministic: false
  seed: 42

rewards:
  food: 1.0
  death: -1.0
  step: -0.01

training:
  episodes: 500  # Quick demo (normally 5000)
  max_steps: 500
  eval_frequency: 50
  save_frequency: 250
  checkpoint_dir: 'checkpoints'
  log_dir: 'reports'

evaluation:
  episodes: 100
  render: false
