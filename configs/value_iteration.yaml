# Configuration for Value Iteration agent

agent:
  type: 'value_iteration'
  discount_factor: 0.99
  theta: 0.001  # Convergence threshold
  max_iterations: 1000
  max_states: 50000  # Memory limit for state space

environment:
  board_size: 6  # Small board for tractable state space
  state_type: 'feature'
  deterministic: true  # Deterministic for VI
  seed: 42

rewards:
  food: 1.0
  death: -1.0
  step: -0.01

evaluation:
  episodes: 100
  render: false
